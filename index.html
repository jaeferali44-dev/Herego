<!doctype html>

    <meta charset="UTF-8" />

    <!-- Preconnect & Preload Fonts with display=swap to Prevent White Screen -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    
    <style>
      /* Smooth font transition once loaded */
      html.fonts-loaded body {
        transition: opacity 0.2s ease-in-out;
      }
    </style>

    <script>
      (function() {
        document.documentElement.classList.add('fonts-loading');
        
        if ('fonts' in document) {
          var timeout = setTimeout(function() {
            document.documentElement.classList.remove('fonts-loading');
            document.documentElement.classList.add('fonts-loaded');
          }, 500);

          Promise.all([
            document.fonts.load('400 1em "Plus Jakarta Sans"'),
            document.fonts.load('600 1em "Plus Jakarta Sans"'),
            document.fonts.load('700 1em "Plus Jakarta Sans"'),
            document.fonts.load('400 1em "Playfair Display"'),
            document.fonts.ready
          ]).then(function() {
            clearTimeout(timeout);
            document.documentElement.classList.remove('fonts-loading');
            document.documentElement.classList.add('fonts-loaded');
          }).catch(function() {
            clearTimeout(timeout);
            document.documentElement.classList.remove('fonts-loading');
            document.documentElement.classList.add('fonts-loaded');
          });
        } else {
          document.documentElement.classList.remove('fonts-loading');
          document.documentElement.classList.add('fonts-loaded');
        }
      })();
    </script>

    <!-- Automatic Domain Origin Dynamic Adapter -->
    <script>
      (function() {
        var origin = window.location.origin;
        if (!origin) return;
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute('content', origin + window.location.pathname);
        var ogImage = document.querySelector('meta[property="og:image"]');
        if (ogImage) ogImage.setAttribute('content', origin + '/logo.png');
        var twitterImage = document.querySelector('meta[name="twitter:image"]');
        if (twitterImage) twitterImage.setAttribute('content', origin + '/logo.png');
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute('href', origin + window.location.pathname);

        // Update JSON-LD structured data dynamically
        window.addEventListener('DOMContentLoaded', function() {
          try {
            var scripts = document.querySelectorAll('script[type="application/ld+json"]');
            scripts.forEach(function(s) {
              var text = s.textContent;
              if (text && text.includes('TravelAgency')) {
                var data = JSON.parse(text);
                data.url = origin;
                data.logo = origin + '/logo.png';
                s.textContent = JSON.stringify(data, null, 2);
              }
            });
          } catch(e) {}
        });
      })();
    </script>
